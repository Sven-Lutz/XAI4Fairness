<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} – XAI4Fairness</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: white;
        border-bottom: 1px solid #ccc;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        flex-wrap: wrap;
      }

      .site-title h1 {
        margin: 0;
        font-size: 1.5em;
      }

      .site-title p {
        margin: 5px 0 0 0;
        font-size: 0.9em;
        color: #666;
      }

      nav a {
        margin-left: 1.5em;
        text-decoration: none;
        color: black;
        font-weight: bold;
      }

      .content {
        padding: 140px 2em 2em 2em;
        flex: 1;
      }

      @media (max-width: 768px) {
        .content {
          padding: 160px 1em 2em 1em;
        }

        header {
          flex-direction: column;
          align-items: flex-start;
        }

        nav {
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="site-title">
        <h1>Explainable AI for Fairness</h1>
        <p>Welcome to our academic website on XAI & Fairness</p>
      </div>
      <nav>
        <a href="{{ site.baseurl }}/">🏠 Front page</a>
        <a href="{{ site.baseurl }}/research/">📚 Research</a>
      </nav>
    </header>

    <div class="container">
      <div class="content">{{ content }}</div>
    </div>
  </body>
</html>
